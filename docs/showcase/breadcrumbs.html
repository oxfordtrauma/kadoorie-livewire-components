<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breadcrumbs — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Breadcrumbs
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Trail
                        </h2>

                                                    <div class="p-4">
                                <nav aria-label="Breadcrumb" data-test="breadcrumbs" >
    <ol class="flex flex-wrap items-center gap-1 text-sm text-text-muted">
                    <li class="inline-flex items-center gap-1" data-test="breadcrumb-item">
                                    <a
                        href="#"
                        data-test="breadcrumb-link"
                        class="kad-focusable rounded hover:text-primary hover:underline"
                    >
                        Home
                    </a>
                    <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    data-test="kadoorie-icon"
            aria-hidden="true"
        focusable="false"
        class="kad-icon inline-block shrink-0 align-middle text-text-muted-large"
>
        <path d="m9 18 6-6-6-6"/>
</svg>
                            </li>
                    <li class="inline-flex items-center gap-1" data-test="breadcrumb-item">
                                    <a
                        href="#"
                        data-test="breadcrumb-link"
                        class="kad-focusable rounded hover:text-primary hover:underline"
                    >
                        Library
                    </a>
                    <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    data-test="kadoorie-icon"
            aria-hidden="true"
        focusable="false"
        class="kad-icon inline-block shrink-0 align-middle text-text-muted-large"
>
        <path d="m9 18 6-6-6-6"/>
</svg>
                            </li>
                    <li class="inline-flex items-center gap-1" data-test="breadcrumb-item">
                                    <span aria-current="page" data-test="breadcrumb-current" class="font-medium text-text">
                        Buttons
                    </span>
                            </li>
            </ol>
</nav>

                            </div>
                        
                        
                        <pre tabindex="0" class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::breadcrumbs :items=&quot;[[&#039;label&#039; =&gt; &#039;Home&#039;, &#039;url&#039; =&gt; &#039;#&#039;], [&#039;label&#039; =&gt; &#039;Library&#039;, &#039;url&#039; =&gt; &#039;#&#039;], [&#039;label&#039; =&gt; &#039;Buttons&#039;]]&quot; /&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
