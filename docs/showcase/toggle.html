<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toggle — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Toggle
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Notifications
                        </h2>

                                                    <div class="p-4">
                                <label
    data-test="notify-toggle-label"
    class="inline-flex min-h-11 cursor-pointer items-center gap-2"
>
    <span class="relative inline-flex shrink-0">
        <input
            type="checkbox"
            role="switch"
            id="notify"
            name="notify"
            value="1"
            data-test="notify-toggle"
            aria-checked="true"
            x-data
            x-on:change="$el.setAttribute('aria-checked', $el.checked ? 'true' : 'false')"
            checked                                                            class="peer sr-only"
        />
        <span
            aria-hidden="true"
            class="h-6 w-11 rounded-full bg-border-strong transition-colors peer-checked:bg-primary peer-focus-visible:shadow-[var(--kad-ring)] peer-disabled:opacity-50"
        ></span>
        <span
            aria-hidden="true"
            class="absolute left-0.5 top-0.5 size-5 rounded-full bg-surface shadow-sm transition-transform peer-checked:translate-x-5"
        ></span>
    </span>
            <span class="text-sm text-text">Email notifications</span>
    </label>

                            </div>
                        
                        
                        <pre tabindex="0" class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::toggle name=&quot;notify&quot; label=&quot;Email notifications&quot; :checked=&quot;true&quot; /&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
