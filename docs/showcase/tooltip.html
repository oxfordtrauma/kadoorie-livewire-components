<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tooltip — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Tooltip
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            On a button
                        </h2>

                                                    <div class="p-4">
                                <span
    x-data="{ open: false }"
    x-on:mouseenter="open = true"
    x-on:mouseleave="open = false"
    x-on:focusin="open = true"
    x-on:focusout="open = false"
    x-on:keydown.escape="open = false"
    data-test="tooltip-wrap"
    class="relative inline-flex"
>
    <span
        tabindex="0"
        aria-describedby="tooltip-efc1a46f"
        data-test="tooltip-trigger"
        class="kad-focusable inline-flex rounded"
    >
        <button
    type="button"
    data-test="kadoorie-button"
        aria-busy="false"
    class="kad-focusable inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium min-h-11 transition select-none disabled:opacity-50 disabled:cursor-not-allowed bg-transparent text-text hover:bg-surface-muted text-sm px-3.5 gap-1.5"
>
        Hover me
</button>
    </span>

    <span
        role="tooltip"
        id="tooltip-efc1a46f"
        x-show="open"
        x-cloak
        data-test="tooltip"
        class="pointer-events-none absolute z-50 whitespace-nowrap rounded bg-secondary px-2 py-1 text-xs text-white shadow-md bottom-full left-1/2 mb-1 -translate-x-1/2"
    >
        Copied to clipboard
    </span>
</span>

                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::tooltip text=&quot;Copied to clipboard&quot;&gt;&lt;x-kadoorie::button variant=&quot;ghost&quot;&gt;Hover me&lt;/x-kadoorie::button&gt;&lt;/x-kadoorie::tooltip&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
