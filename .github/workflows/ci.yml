name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, pcntl, bcmath, mbstring, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (dry run)
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Pest
        run: ./vendor/bin/pest --compact

      - name: Composer audit
        run: composer audit

  javascript:
    name: JavaScript quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Jest
        run: npm run test:js

      - name: npm audit (high)
        run: npm audit --audit-level=high

  browser:
    name: Browser (functional + WCAG)
    runs-on: ubuntu-latest
    needs: [php, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Functional tests
        run: |
          if ls tests/Playwright/*.spec.ts >/dev/null 2>&1; then
            npm run test:e2e
          else
            echo "No functional specs yet; skipping."
          fi

      - name: WCAG tests
        run: |
          if ls tests/WCAG/*.spec.ts >/dev/null 2>&1; then
            npm run test:wcag
          else
            echo "No WCAG specs yet; skipping."
          fi
