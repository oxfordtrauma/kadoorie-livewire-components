name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, pcntl, bcmath, mbstring, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
            ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (dry run)
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=-1

      - name: Pest
        run: ./vendor/bin/pest --compact

      - name: Composer audit
        run: composer audit

  javascript:
    name: JavaScript quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Jest
        run: npm run test:js

      - name: npm audit (high)
        run: npm audit --audit-level=high

  react:
    name: React quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test:react

  browser:
    name: Browser (functional + WCAG)
    runs-on: ubuntu-latest
    needs: [ php, javascript, react ]
    steps:
      - uses: actions/checkout@v4

      # Functional specs run against a live Testbench workbench, so PHP and the
      # Composer dependencies are required alongside Node.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, pcntl, bcmath, mbstring, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build stylesheet and JS bundles
        run: |
          npm run build
          npm run build:workbench
          npm run build:showcase

      - name: Regenerate the static showcase (WCAG target)
        run: vendor/bin/testbench kadoorie:build-showcase

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Functional tests
        run: npm run test:e2e

      - name: WCAG tests
        run: npm run test:wcag

      # The react-* Playwright projects drive the Vite React workbench (started
      # by playwright.config webServer). They reuse the kadoorie.css built above.
      - name: React functional tests
        run: npm run test:react:e2e

      - name: React WCAG tests
        run: npm run test:react:wcag
