<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile menu — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Profile menu
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Account menu
                        </h2>

                                                    <div class="p-4">
                                <div
    x-data="{ open: false }"
    x-on:keydown.escape="open = false"
    data-test="profile-menu" class="relative inline-block text-left"
>
    <button
        type="button"
        x-ref="trigger"
        data-test="profile-menu-trigger"
        aria-haspopup="true"
        aria-expanded="false"
        x-bind:aria-expanded="open ? 'true' : 'false'"
        x-on:click="open = ! open; if (open) $nextTick(() => $focus.within($refs.menu).first())"
        class="kad-focusable inline-flex min-h-11 items-center gap-2 rounded-full py-0.5 pl-0.5 pr-2 hover:bg-surface-muted"
    >
                    <span
    data-test="avatar"
    class="relative inline-flex shrink-0 size-8 text-xs"
>
            <span
            aria-hidden="true"
            data-test="avatar-initials"
            class="flex h-full w-full items-center justify-center rounded-full bg-primary-subtle font-semibold text-primary"
        >
            JD
        </span>
        <span class="sr-only">Jane Doe</span>
    
    </span>
        <span class="hidden text-sm font-medium text-text sm:inline" data-test="profile-menu-name">Jane Doe</span>
        <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    data-test="kadoorie-icon"
            aria-hidden="true"
        focusable="false"
        class="kad-icon inline-block shrink-0 align-middle text-text-muted-large"
>
        <path d="m6 9 6 6 6-6"/>
</svg>
            </button>

    <div
        x-ref="menu"
        role="menu"
        data-test="dropdown-menu"
        x-show="open"
        x-cloak
        x-trap="open"
        x-on:click.outside="open = false"
        x-on:keydown.down.prevent="$focus.wrap().next()"
        x-on:keydown.up.prevent="$focus.wrap().previous()"
        class="absolute z-50 mt-1 min-w-44 rounded-md border border-border bg-surface p-1 shadow-lg right-0"
    >
        <div data-test="profile-menu-header" class="border-b border-border px-3 py-2">
        <p class="text-sm font-medium text-text">Jane Doe</p>
                    <p class="text-xs text-text-muted">jane@example.com</p>
            </div>

            <a
    role="menuitem"
     href="#"     data-test="profile-menu-change-details" class="kad-focusable flex min-h-11 w-full items-center gap-2 rounded px-3 text-left text-sm text-text-body hover:bg-surface-muted"
>
    Change details
</a>
    
            <form method="POST" action="#" data-test="profile-menu-logout-form" class="block">
            <input type="hidden" name="_token" value="" autocomplete="off">            <button
    role="menuitem"
     type="submit"     data-test="profile-menu-logout" class="kad-focusable flex min-h-11 w-full items-center gap-2 rounded px-3 text-left text-sm text-text-body hover:bg-surface-muted"
>
    Log out
</button>
        </form>
    </div>
</div>

                            </div>
                        
                        
                        <pre tabindex="0" class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::profile-menu name=&quot;Jane Doe&quot; email=&quot;jane@example.com&quot; initials=&quot;JD&quot; change-details-url=&quot;#&quot; logout-url=&quot;#&quot; /&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
