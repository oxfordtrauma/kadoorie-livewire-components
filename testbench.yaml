providers:
  - Livewire\LivewireServiceProvider
  - Kadoorie\LivewireComponents\KadoorieComponentsServiceProvider

workbench:
  start: '/'
  install: false
  discovers:
    web: true

env:
  - APP_NAME="Kadoorie Components Workbench"
  # The workbench runs on an in-memory SQLite database with no cache table, and
  # Livewire rate-limits checksum failures through the cache on every update.
  - CACHE_STORE=array
