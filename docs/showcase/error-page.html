<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Error page — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Error page
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            404
                        </h2>

                                                    <div class="p-4">
                                <div
    data-test="kadoorie-error-page"
    class="flex min-h-dvh items-center justify-center bg-bg p-4"
>
    <main id="main-content" class="w-full max-w-md text-center">
        <p data-test="error-page-status" class="kad-nums text-5xl font-bold text-primary">
            404
        </p>

        <h1 data-test="error-page-title" class="mt-2 text-2xl font-semibold text-text">
            Page not found
        </h1>

        <p class="mt-2 text-sm text-text-muted">We could not find the page you were looking for.</p>

        <div class="mt-6 flex items-center justify-center gap-3">
                            <a
                    href="/"
                    data-test="error-page-home"
                    class="kad-focusable inline-flex min-h-11 items-center rounded-md bg-primary px-4 text-sm font-medium text-on-primary hover:bg-primary-hover"
                >
                    Back to home
                </a>
                    </div>
    </main>
</div>

                            </div>
                        
                        
                        <pre tabindex="0" class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::error-page :status=&quot;404&quot; /&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
