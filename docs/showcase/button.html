<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Button — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Button
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Primary
                        </h2>

                                                    <div class="p-4">
                                <button
    type="button"
    data-test="kadoorie-button"
        aria-busy="false"
    class="kad-focusable inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium min-h-11 transition select-none disabled:opacity-50 disabled:cursor-not-allowed bg-primary text-on-primary hover:bg-primary-hover text-sm px-3.5 gap-1.5"
>
        Save changes
</button>

                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::button&gt;Save changes&lt;/x-kadoorie::button&gt;</code></pre>
                    </article>
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Danger / loading
                        </h2>

                                                    <div class="p-4">
                                <button
    type="button"
    data-test="kadoorie-button"
    disabled    aria-busy="true"
    class="kad-focusable inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium min-h-11 transition select-none disabled:opacity-50 disabled:cursor-not-allowed bg-danger text-white hover:brightness-95 text-sm px-3.5 gap-1.5"
>
            <span data-test="kadoorie-button-spinner" class="kad-spinner" aria-hidden="true"></span>
        Deleting
</button>

                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::button variant=&quot;danger&quot; :loading=&quot;true&quot;&gt;Deleting&lt;/x-kadoorie::button&gt;</code></pre>
                    </article>
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Ghost
                        </h2>

                                                    <div class="p-4">
                                <button
    type="button"
    data-test="kadoorie-button"
        aria-busy="false"
    class="kad-focusable inline-flex items-center justify-center whitespace-nowrap rounded-md font-medium min-h-11 transition select-none disabled:opacity-50 disabled:cursor-not-allowed bg-transparent text-text hover:bg-surface-muted text-sm px-3.5 gap-1.5"
>
        Cancel
</button>

                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::button variant=&quot;ghost&quot;&gt;Cancel&lt;/x-kadoorie::button&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
