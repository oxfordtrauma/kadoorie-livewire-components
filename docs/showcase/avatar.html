<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avatar — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Avatar
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Initials + presence
                        </h2>

                                                    <div class="p-4">
                                <span
    data-test="avatar"
    class="relative inline-flex shrink-0 size-12 text-base"
>
            <span
            aria-hidden="true"
            data-test="avatar-initials"
            class="flex h-full w-full items-center justify-center rounded-full bg-primary-subtle font-semibold text-primary"
        >
            JD
        </span>
        <span class="sr-only">Jane Doe</span>
    
            <span
            aria-hidden="true"
            data-test="avatar-presence"
            class="absolute bottom-0 right-0 block size-1/4 rounded-full ring-2 ring-surface bg-success"
        ></span>
        <span class="sr-only">Online</span>
    </span>

                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;x-kadoorie::avatar alt=&quot;Jane Doe&quot; initials=&quot;JD&quot; presence=&quot;online&quot; size=&quot;lg&quot; /&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
