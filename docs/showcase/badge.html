<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Badge — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Badge
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Tones
                        </h2>

                                                    <div class="p-4">
                                <div class="flex flex-wrap gap-2"><span
    data-test="badge"
    class="inline-flex items-center border font-medium text-text bg-success-subtle border-success rounded-md gap-1 px-2 py-0.5 text-xs"
>
            <span class="text-success" data-test="badge-icon">
            <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    data-test="kadoorie-icon"
            aria-hidden="true"
        focusable="false"
        class="kad-icon inline-block shrink-0 align-middle"
>
        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
</svg>
        </span>
        <span data-test="badge-label">Active</span>
</span>
<span
    data-test="badge"
    class="inline-flex items-center border font-medium text-text bg-warning-subtle border-warning rounded-md gap-1 px-2 py-0.5 text-xs"
>
            <span class="text-warning" data-test="badge-icon">
            <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    data-test="kadoorie-icon"
            aria-hidden="true"
        focusable="false"
        class="kad-icon inline-block shrink-0 align-middle"
>
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
</svg>
        </span>
        <span data-test="badge-label">Pending</span>
</span>
<span
    data-test="badge"
    class="inline-flex items-center border font-medium text-text bg-danger-subtle border-danger rounded-full gap-1 px-2 py-0.5 text-xs"
>
            <span class="text-danger" data-test="badge-icon">
            <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    data-test="kadoorie-icon"
            aria-hidden="true"
        focusable="false"
        class="kad-icon inline-block shrink-0 align-middle"
>
        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
</svg>
        </span>
        <span data-test="badge-label">Failed</span>
</span>
</div>
                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;div class=&quot;flex flex-wrap gap-2&quot;&gt;&lt;x-kadoorie::badge tone=&quot;success&quot;&gt;Active&lt;/x-kadoorie::badge&gt;&lt;x-kadoorie::badge tone=&quot;warning&quot;&gt;Pending&lt;/x-kadoorie::badge&gt;&lt;x-kadoorie::badge tone=&quot;danger&quot; shape=&quot;pill&quot;&gt;Failed&lt;/x-kadoorie::badge&gt;&lt;/div&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
