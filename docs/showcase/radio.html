<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio — Kadoorie Components</title>
<link rel="stylesheet" href="kadoorie.css" />
    </head>
    <body class="bg-bg text-text-body">
        <main id="main-content" class="mx-auto max-w-container px-4 py-8">
            <nav aria-label="Breadcrumb" class="mb-4 text-sm">
                <a href="index.html" class="kad-focusable rounded text-primary hover:underline">
                    &larr; All components
                </a>
            </nav>

            <h1 class="mb-6 text-3xl font-semibold capitalize text-text">
                Radio
            </h1>

            <div class="flex flex-col gap-6">
                                    <article class="overflow-hidden rounded-lg border border-border bg-surface">
                        <h2 class="border-b border-border px-4 py-2 text-sm font-medium text-text-muted">
                            Plan
                        </h2>

                                                    <div class="p-4">
                                <div class="flex flex-col gap-2"><label
    for="plan-pro"
    data-test="plan-radio-label"
    class="inline-flex min-h-11 cursor-pointer items-center gap-2"
>
    <input
        type="radio"
        id="plan-pro"
        name="plan"
        value="pro"
        data-test="plan-radio"
        checked                                        class="kad-focusable size-5 shrink-0 accent-primary border-border rounded-full"
    />
            <span class="text-sm text-text">Pro</span>
    </label>
<label
    for="plan-team"
    data-test="plan-radio-label"
    class="inline-flex min-h-11 cursor-pointer items-center gap-2"
>
    <input
        type="radio"
        id="plan-team"
        name="plan"
        value="team"
        data-test="plan-radio"
                                                class="kad-focusable size-5 shrink-0 accent-primary border-border rounded-full"
    />
            <span class="text-sm text-text">Team</span>
    </label>
</div>
                            </div>
                        
                        <pre class="overflow-x-auto border-t border-border bg-surface-muted p-4 text-xs text-text-body"><code>&lt;div class=&quot;flex flex-col gap-2&quot;&gt;&lt;x-kadoorie::radio name=&quot;plan&quot; value=&quot;pro&quot; label=&quot;Pro&quot; :checked=&quot;true&quot; /&gt;&lt;x-kadoorie::radio name=&quot;plan&quot; value=&quot;team&quot; label=&quot;Team&quot; /&gt;&lt;/div&gt;</code></pre>
                    </article>
                            </div>
        </main>
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.14.1/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    </body>
</html>
